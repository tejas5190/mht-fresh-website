name: Publish MHT Fresh to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "wogan.html"
      - "fruits.html"
      - "sitemap.xml"
      - "robots.txt"
      - "CNAME"
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp wogan.html _site/wogan.html
          cp fruits.html _site/fruits.html
          cp CNAME _site/CNAME
          cp sitemap.xml _site/sitemap.xml
          cp robots.txt _site/robots.txt
          if [ -d assets ]; then cp -R assets _site/assets; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
